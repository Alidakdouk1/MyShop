<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pick&amp;Go LB">
  <title>Pick&amp;Go LB</title>
  <defs>
    <linearGradient id="fg" x1="0.18" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#00D1C1"/>
      <stop offset="55%"  stop-color="#54E89A"/>
      <stop offset="100%" stop-color="#A3FF12"/>
    </linearGradient>
  </defs>
  <!--
    Favicon-optimised PG monogram. Geometry is simpler than icon.svg
    so the shape stays legible at 16-32 px (the OS/browser favicon range).
    No accent chevron — it would mush at this size.
  -->
