  <path fill="url(#fg)" fill-rule="evenodd" d="
    M 12 8
    L 40 8
    L 56 24
    L 40 40
    L 28 40
    L 28 32
    L 36 32
    L 46 24
    L 36 16
    L 20 16
    L 20 40
    L 28 40
    L 28 48
    L 20 48
    L 20 56
    L 12 56
    Z
    M 28 20
    L 28 32
    L 36 32
    L 40 28
    L 40 24
    L 36 20
    Z
  "/>
</svg>
